<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Appointment</h1>
        <form method="POST" action="{{ url_for('edit_appointment', id=appointment.Appointment_ID) }}">
            <label for="patient_id">Patient:</label>
            <select id="patient_id" name="patient_id" required>
                {% for pat in patients %}
                    <option value="{{ pat.Patient_ID }}" {% if pat.Patient_ID == appointment.Patient_ID %}selected{% endif %}>
                        {{ pat.Patient_Name }}
                    </option>
                {% endfor %}
            </select><br>

            <label for="doctor_id">Doctor:</label>
            <select id="doctor_id" name="doctor_id" required>
                {% for doc in doctors %}
                    <option value="{{ doc.Doctor_ID }}" {% if doc.Doctor_ID == appointment.Doctor_ID %}selected{% endif %}>
                        {{ doc.Doctor_Name }} ({{ doc.Specialization }})
                    </option>
                {% endfor %}
            </select><br>

            <label for="appointment_date">Appointment Date & Time:</label>
            <input type="datetime-local" id="appointment_date" name="appointment_date" value="{{ appointment.Appointment_Date_formatted }}" required><br>

            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="Scheduled" {% if appointment.Status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
                <option value="Completed" {% if appointment.Status == 'Completed' %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if appointment.Status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
            </select><br>

            <button type="submit" class="button">Update Appointment</button>
            <a href="{{ url_for('appointments') }}" class="button back-button">Cancel</a>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
