<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medical Record</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Medical Record</h1>
        <form method="POST" action="{{ url_for('edit_medical_record', id=record.Record_ID) }}">
            <label for="patient_id">Patient:</label>
            <select id="patient_id" name="patient_id" required>
                {% for pat in patients %}
                    <option value="{{ pat.Patient_ID }}" {% if pat.Patient_ID == record.Patient_ID %}selected{% endif %}>
                        {{ pat.Patient_Name }}
                    </option>
                {% endfor %}
            </select><br>

            <label for="doctor_id">Doctor:</label>
            <select id="doctor_id" name="doctor_id" required>
                {% for doc in doctors %}
                    <option value="{{ doc.Doctor_ID }}" {% if doc.Doctor_ID == record.Doctor_ID %}selected{% endif %}>
                        {{ doc.Doctor_Name }} ({{ doc.Specialization }})
                    </option>
                {% endfor %}
            </select><br>

            <label for="symptoms">Symptoms:</label>
            <textarea id="symptoms" name="symptoms" rows="4">{{ record.Symptoms }}</textarea><br>

            <label for="diagnosis">Diagnosis:</label>
            <textarea id="diagnosis" name="diagnosis" rows="4">{{ record.Diagnosis }}</textarea><br>

            <button type="submit" class="button">Update Medical Record</button>
            <a href="{{ url_for('medical_records') }}" class="button back-button">Cancel</a>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
