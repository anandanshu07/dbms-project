<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Department</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Edit Department</h1>
        <form method="POST" action="{{ url_for('edit_department', id=department.Department_ID) }}">
            <label for="department_name">Department Name:</label>
            <input type="text" id="department_name" name="department_name" value="{{ department.Department_Name }}" required><br>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" value="{{ department.Location }}"><br>

            <button type="submit" class="button">Update Department</button>
            <a href="{{ url_for('departments') }}" class="button back-button">Cancel</a>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
