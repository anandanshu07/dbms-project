{% extends 'base.html' %}

{% block content %}
    <h1>Edit Appointment</h1>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_appointment', id=appointment.Appointment_ID) }}">
                
                <div class="mb-3">
                    <label for="patient_id" class="form-label">Patient:</label>
                    <select class="form-select" id="patient_id" name="patient_id" required>
                        {% for pat in patients %}
                            <option value="{{ pat.Patient_ID }}" {% if pat.Patient_ID == appointment.Patient_ID %}selected{% endif %}>
                                {{ pat.Patient_Name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="doctor_id" class="form-label">Doctor:</label>
                    <select class="form-select" id="doctor_id" name="doctor_id" required>
                        {% for doc in doctors %}
                            <option value="{{ doc.Doctor_ID }}" {% if doc.Doctor_ID == appointment.Doctor_ID %}selected{% endif %}>
                                {{ doc.Doctor_Name }} ({{ doc.Specialization }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="appointment_date" class="form-label">Appointment Date & Time:</label>
                    <input type="datetime-local" class="form-control" id="appointment_date" name="appointment_date" value="{{ appointment.Appointment_Date_formatted }}" required>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">Status:</label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="Scheduled" {% if appointment.Status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
                        <option value="Completed" {% if appointment.Status == 'Completed' %}selected{% endif %}>Completed</option>
                        <option value="Cancelled" {% if appointment.Status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Update Appointment</button>
                <a href="{{ url_for('appointments') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
