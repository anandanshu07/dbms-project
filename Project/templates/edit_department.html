{% extends 'base.html' %}

{% block content %}
    <h1>Edit Department</h1>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_department', id=department.Department_ID) }}">
                
                <div class="mb-3">
                    <label for="department_name" class="form-label">Department Name:</label>
                    <input type="text" class="form-control" id="department_name" name="department_name" value="{{ department.Department_Name }}" required>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">Location:</label>
                    <input type="text" class="form-control" id="location" name="location" value="{{ department.Location }}">
                </div>

                <button type="submit" class="btn btn-primary">Update Department</button>
                <a href="{{ url_for('departments') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
